<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Digital Leap Marketing Solutions — HR Management System" />
    <!-- Private internal tool — do NOT surface in search results. Kept in
         sync with public/robots.txt and the X-Robots-Tag header in
         vercel.json. All three together so honest crawlers respect it
         (meta + robots.txt) AND the header applies even when robots.txt
         is missed or the crawler ignores meta tags (e.g. some LLM
         crawlers only honor the header). -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#EE2770" />
    <!-- iOS PWA metadata. Without these, iOS Safari either grays out
         "Add to Home Screen" or launches the installed app in a
         Safari-with-address-bar shell instead of full standalone.
         `apple-mobile-web-app-capable` is the historic name; iOS 17+
         also honors `mobile-web-app-capable`. Keep both. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HRMS" />
    <title>Digital Leap HRMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Cache-buster boot script. Runs BEFORE the React bundle so a
      // stale service worker or an outdated Cache Storage entry never
      // gets a chance to intercept the module fetch. Safe on every
      // load — no-ops when there's nothing to clear.
      //
      // Belt + braces vs. the Vercel Cache-Control headers on
      // index.html: headers stop the SHELL from being cached; this
      // stops any old Service Worker / Cache API entry from proxying
      // stale JS/CSS to the tab.
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            // Sweep any legacy service worker (from earlier deploys)
            // and register the current /sw.js. The push handler + PWA
            // install experience are worth an SW, but we deliberately
            // keep the worker itself dumb — no offline shell, no
            // fetch-time cache, so a stale SW can't intercept fresh
            // bundle URLs. Every load re-registers, so upgrades ship
            // like any other file.
            var OWN_SW = new URL('/sw.js', location.origin).href;
            navigator.serviceWorker.getRegistrations()
              .then(function (regs) {
                regs.forEach(function (r) {
                  var scriptUrl = r.active && r.active.scriptURL;
                  if (scriptUrl !== OWN_SW) { try { r.unregister(); } catch (e) {} }
                });
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
              })
              .catch(function () {
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
              });
          }
          if (typeof caches !== 'undefined' && caches && caches.keys) {
            // Purge legacy CacheStorage entries — we don't use caches
            // ourselves, so anything here is from an older SW deploy.
            caches.keys()
              .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
              .catch(function () {});
          }
        } catch (e) { /* boot script must never throw */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
